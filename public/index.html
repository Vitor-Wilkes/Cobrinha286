<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Snake.io 1v1</title>
    <style>
        /* Estilos Globais e Reset */
        body {
            margin: 0;
            overflow: hidden;
            background: #161816;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #E0E0E0;
            user-select: none;
        }

        canvas {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            /* O jogo fica no fundo */
        }

        /* Telas Principais (Fundo Sólido) */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #161816;
            z-index: 10;
        }

        /* Pop-up sobre o Jogo (Fundo Translúcido) */
        #endScreen {
            background: rgba(0, 0, 0, 0.7);
            /* Fundo escurinho transparente */
            z-index: 20;
            /* Fica acima do Canvas */
        }

        /* Tipografia */
        h1 {
            font-size: 2.8rem;
            color: #5DB971;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        h2 {
            font-size: 2rem;
            color: #D46A84;
            margin-bottom: 10px;
        }

        h3 {
            color: #E0E0E0;
            font-weight: normal;
        }

        /* Campos e Botões */
        input {
            padding: 15px;
            font-size: 1.1rem;
            background: #1F221F;
            border: 2px solid #5DB971;
            color: white;
            border-radius: 8px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
            width: 260px;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #D46A84;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1rem;
            background: transparent;
            border: 2px solid #5DB971;
            color: #5DB971;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            margin: 10px;
            width: 294px;
        }

        button:hover {
            background: #5DB971;
            color: #161816;
        }

        button.btn-pink {
            border-color: #D46A84;
            color: #D46A84;
        }

        button.btn-pink:hover {
            background: #D46A84;
            color: #161816;
        }

        .divider {
            width: 50px;
            height: 4px;
            background-color: #303632;
            border-radius: 2px;
            margin: 20px 0;
        }

        /* Cards do Lobby e Pop-up */
        .card-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1F221F;
            padding: 40px 60px;
            border-radius: 12px;
            border: 1px solid #303632;
            min-width: 300px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .lobby-code {
            font-size: 3.5rem;
            font-weight: bold;
            color: #5DB971;
            letter-spacing: 4px;
            margin: 10px 0 30px 0;
        }

        .lobby-players {
            text-align: left;
            width: 100%;
            margin-bottom: 20px;
        }

        .lobby-players p {
            font-size: 1.2rem;
            margin: 15px 0;
            padding: 15px;
            background: #161816;
            border-left: 4px solid #D46A84;
            border-radius: 4px;
        }

        .lobby-players span {
            font-weight: bold;
            color: #E0E0E0;
        }

        /* Botões de Skin */
        .skin-selector {
            margin-bottom: 25px;
            text-align: center;
        }

        .skin-selector h3 {
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: #E0E0E0;
            font-weight: bold;
        }

        .skin-row {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .skin-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            padding: 0;
            margin: 0;
        }

        .skin-btn:hover {
            transform: scale(1.1);
        }

        .skin-btn.selected {
            border-color: white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body>

    <!-- 1. TELA DE MENU INICIAL -->
    <div id="menu" class="screen">
        <h1>Snake.io</h1>
        <input type="text" id="nick" placeholder="Digite seu Nick">
        <button onclick="criarSala()">Criar Nova Sala</button>
        <div class="divider"></div>
        <input type="text" id="roomCodeInput" placeholder="Código da Sala">
        <button class="btn-pink" onclick="entrarSala()">Entrar na Sala</button>
    </div>

    <!-- 2. TELA DE LOBBY (Sala de Espera) -->
    <div id="lobby" class="screen" style="display: none;">
        <div class="card-container">
            <h2>Código da Sala</h2>
            <div class="lobby-code" id="lobbyCode">---</div>

            <div class="lobby-players">
                <p>Jogador 1: <span id="player1Name">Aguardando...</span></p>
                <p>Jogador 2: <span id="player2Name">Aguardando...</span></p>
            </div>

            <!-- NOVA SEÇÃO: Escolha de Skin -->
            <div class="skin-selector">
                <h3>Escolha sua Skin:</h3>
                <div class="skin-row">
                    <button class="skin-btn selected" style="background: #5DB971;"
                        onclick="mudarSkin('#5DB971', this)"></button>
                    <button class="skin-btn" style="background: #D46A84;" onclick="mudarSkin('#D46A84', this)"></button>

                    <!-- Botão da Skin Ravena -->
                    <button class="skin-btn" style="background: #49309b; border-color: #ffd700; border-width: 2px;"
                        onclick="mudarSkin('raven', this)"></button>

                    <!-- Botão da Skin Clover -->
                    <button class="skin-btn" style="background: #e3242b; border-color: #f5d76e; border-width: 2px;"
                        onclick="mudarSkin('clover', this)"></button>

                    <!-- Botão da Skin Palmeiras -->
                    <button class="skin-btn" style="background: #004f2d; border-color: #ffffff; border-width: 2px;"
                        onclick="mudarSkin('palmeiras', this)"></button>

                    <!-- Botão da Skin São Paulo -->
                    <button class="skin-btn" style="background: #000000; border-color: #ff0000; border-width: 2px;"
                        onclick="mudarSkin('saopaulo', this)"></button>
                </div>
            </div>

            <button id="startBtn" onclick="iniciarJogo()" style="display: none;">Iniciar Partida</button>
            <button class="btn-pink" onclick="sairDaSala()"
                style="margin-top: 20px; width: auto; font-size: 0.9rem; padding: 10px 20px;">Sair da Sala</button>
        </div>
    </div>

    <!-- 3. TELA DE FIM DE JOGO (Pop-up Translúcido) -->
    <div id="endScreen" class="screen" style="display: none;">
        <div class="card-container" style="border-color: #D46A84; box-shadow: 0 0 30px rgba(212, 106, 132, 0.2);">
            <h2 style="color: #5DB971;">Fim de Jogo</h2>
            <h1 id="vencedorTexto" style="color: #D46A84; margin: 20px 0 40px 0;">ALGUÉM VENCEU!</h1>

            <button onclick="pedirRevanche()">Jogar Novamente</button>
            <button class="btn-pink" onclick="sairDaSala()">Voltar ao Menu</button>
        </div>
    </div>

    <!-- 4. O CANVAS DO JOGO -->
    <canvas id="gameCanvas" style="display: none;"></canvas>

    <!-- Importando os scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>

</html>
